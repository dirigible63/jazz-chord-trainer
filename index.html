<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17130f"><title>Jazz Chord Trainer</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div><h1>Jazz Chord Trainer</h1><p id="statusLine">Autumn Leaves</p></div><button id="homeBtn" class="icon">⌂</button></header>
<section id="home" class="screen"><div class="hero"><span>CONTINUE</span><h2 id="continueTitle">Day 1</h2><p id="continueSummary"></p><button class="accent" id="continueBtn">Open lesson</button></div>
<h3>Practice</h3><button class="tile" id="lessonsBtn"><b>Lessons</b><small>Browse all 24 days · mark/unmark completion</small></button>
<button class="tile" id="reviewBtn"><b>Review · All Learned</b><small id="reviewCount">0 learned voicings</small></button></section>
<section id="lessons" class="screen hidden"><h2>Lessons</h2><p class="muted">Future days are visible. Only completed days feed the review pool.</p><div id="lessonList"></div></section>
<section id="lesson" class="screen hidden"><button class="back" id="backLessons">← All lessons</button><div class="lessonCard"><span id="dayLabel"></span><h2 id="lessonTitle"></h2><p id="lessonSummary"></p><div id="lessonVoicings"></div><button id="completeBtn" class="accent wide"></button></div></section>
<section id="review" class="screen hidden"><button class="back" id="backHome">← Home</button><div class="drill"><div class="eyebrow" id="counter">All Learned</div><div class="prompt" id="prompt">Tap Start</div><div class="sub" id="promptLabel">Completed lesson material only</div><div id="reveal" class="reveal invisible"><div><span>LH</span><strong id="lh"></strong></div><div><span>RH</span><strong id="rh"></strong></div><small>Notes shown low → high within each hand.</small></div><div class="actions"><button id="revealBtn" disabled>Reveal</button><button class="accent" id="nextBtn">Start</button></div></div></section>
</main><script src="app.js"></script></body></html>
